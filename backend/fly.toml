app = 'hipo-backend'
primary_region = 'nrt'

[build]

[env]
  NODE_ENV = 'production'
  PORT = '3000'
  DB_STORAGE = '/data/database.sqlite'
  INITIAL_PO_BALANCE = '10000'
  INITIAL_MARKET_CAP = '5000'
  # 부팅 시 스키마 동기화.
  # NODE_ENV=production 이면 기본값이 none 이므로 여기서 명시적으로 켠다.
  # 운영 부팅 중 Sequelize alter가 기존 데이터 제약과 충돌하면 서비스가 중단된다.
  # 스키마 변경은 백업 후 `npm run migrate`로 별도 실행하고 서버는 기존 스키마로 시작한다.
  DB_SYNC = 'none'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1

[mounts]
  source = 'hipo_data'
  destination = '/data'
